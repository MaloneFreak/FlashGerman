name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Formatação
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Testes
        run: |
          set -o pipefail
          go vet ./...
          # Em caso de falha, os detalhes viram anotações (visíveis no resumo da execução).
          go test -race -v ./... 2>&1 | tee test.log || {
            grep -E -- "--- FAIL|_test.go:[0-9]+:|panic:" test.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          node tools/web/test/anki.test.mjs
      - name: Compila para todos os sistemas
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done
